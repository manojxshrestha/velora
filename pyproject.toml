[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velora"
dynamic = ["version"]
description = "Velora - Separation Logic Verification Tool with Security Scanning"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "codelion"}
]
keywords = [
    "separation-logic",
    "formal-verification",
    "security",
    "static-analysis",
    "vulnerability-detection",
    "smt",
    "z3"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "z3-solver>=4.8.0",
    # Default TTY experience (`velora tui`, the auto-opened scan TUI) imports
    # these at module import; requirements.txt has always shipped them as core
    # deps, so `pip install .` must too (bugfix BUG-021).
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
scan = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.22.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "requests>=2.25.0",
    "zstandard>=0.22.0",
    "pyyaml>=6.0",
]
all = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.22.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "requests>=2.25.0",
    "zstandard>=0.22.0",
    "pyyaml>=6.0",
]

[project.scripts]
velora = "velora.cli:main"
frame = "velora.cli:main_legacy"

[project.urls]
Homepage = "https://github.com/manojxshrestha/velora"
Documentation = "https://github.com/manojxshrestha/velora#readme"
Repository = "https://github.com/manojxshrestha/velora"
Issues = "https://github.com/manojxshrestha/velora/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["velora*"]
exclude = ["*node_modules*"]

[tool.setuptools.package-data]
"velora._bridge" = ["*.js", "*.json"]

[tool.setuptools.dynamic]
version = {attr = "velora.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["velora"]
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
